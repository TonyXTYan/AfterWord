[project]
name = "afterword"
version = "0.1.0"
description = "Spoken replies for Claude Code, using local TTS on Apple Silicon"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.scripts]
afterword = "afterword.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["uv_build>=0.9,<0.20"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "afterword"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
