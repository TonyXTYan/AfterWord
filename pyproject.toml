[project]
name = "afterword"
version = "0.3.6"
description = "Spoken replies for Claude Code, using local TTS on Apple Silicon"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "numpy>=1.26",
    "tomlkit>=0.13",
    "uvicorn>=0.32",
]

[project.scripts]
afterword = "afterword.cli:main"

[project.optional-dependencies]
qwen = [
    "mlx-audio>=0.6.8",
]
kokoro = [
    "mlx-audio>=0.6.8",
    "en-core-web-sm",
    "misaki[en,ja,zh]>=0.9.4",
]
chatterbox = [
    "mlx-audio>=0.6.8",
    "pykakasi>=2.3",
    "spacy-pkuseg>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.6",
]

[build-system]
requires = ["uv_build>=0.9,<0.20"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "afterword"
module-root = ""

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n 4"
markers = [
    "live: needs the real models; skipped unless AFTERWORD_LIVE_QWEN=1",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E9", "B"]
# B904 asks for `raise ... from err`; the two flagged raises (AlreadyRunning,
# DaemonUnreachable) deliberately replace the low-level error with a message.
ignore = ["B904"]


# The hooks run on the stock macOS python3 (3.9).
[tool.ruff.per-file-target-version]
"afterword/hooks/**" = "py39"
